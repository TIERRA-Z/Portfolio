<style>
  /* Page-specific styles for the contact form only.
     Colors reference the same palette used in style.css. */
  :root {
    --white-alt: #FAF9F6;
    --onyx: #363946;
    --ash: #B1B6A6;
    --eng-violet: #593F62;
    --chi-violet: #7B6D8D;
    --yellow: #FED049;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: var(--onyx);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Navbar styling for contact page */
  .navbar {
    background: var(--eng-violet);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  .navbar .logo a,
  .navbar .menu li a,
  .menu-btn {
    color: #FAF9F6;
  }
  .navbar .logo a span {
    color: var(--yellow);
  }
  .navbar .menu li a:hover,
  .navbar .logo a:hover {
    color: var(--yellow);
  }
  /* Dark navbar should match the darker site background */
  body.dark-theme .navbar {
    background: #121212;
  }
  body.dark-theme .navbar.sticky {
    background: #121212;
  }
  body.dark-theme .navbar .logo a,
  body.dark-theme .navbar .menu li a,
  body.dark-theme .menu-btn {
    color: #FAF9F6;
  }
  body.dark-theme .navbar .logo a span {
    color: var(--yellow);
  }
  body.dark-theme .navbar .menu li a:hover {
    color: var(--yellow);
  }

  .contact-wrapper {
    display: flex;
    justify-content: center;
    padding: 3rem 1rem 4rem 1rem;
    flex: 1;
    padding-top: 140px; /* increased space for fixed navbar */
  }

  .card {
    width: 100%;
    max-width: 480px;
  }

  .typeline {
    font-family: monospace;
    font-size: 13px;
    color: var(--chi-violet);
    min-height: 18px;
    margin-bottom: 4px;
  }

  h1 {
    margin: 0 0 1.5rem;
    font-family: 'Ubuntu', sans-serif;
    font-weight: 600;
  }

  .moods {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .vibe-label {
    font-size: 13px;
    color: var(--chi-violet);
    margin: 0 0 8px;
  }

  .mood-btn {
    background: transparent;
    border: 1px solid var(--chi-violet);
    color: var(--onyx);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }

  .mood-btn.selected {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  /* Dark mode: make mood buttons readable and consistent */
  /* Dark-mode: use dim yellow tone consistent with the rest of the site */
  body.dark-theme .vibe-label {
    color: #AD7E4B;
  }

  body.dark-theme .mood-btn {
    color: #AD7E4B;
    border-color: #AD7E4B;
    background: transparent;
  }

  body.dark-theme .mood-btn.selected{
    background: #AD7E4B;
    border-color: #AD7E4B;
    color: #121212;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, textarea {
    font-family: inherit;
    font-size: 14px;
    border: 1px solid var(--chi-violet);
    border-radius: 6px;
    padding: 10px 12px;
    background: #fff;
  }

  textarea {
    resize: vertical;
  }

  /* Dark-mode inputs and placeholders */
  body.dark-theme input,
  body.dark-theme textarea {
    background: #282828;
    border-color: #3a3a3a;
    color: #FAF9F6;
  }
  body.dark-theme input::placeholder,
  body.dark-theme textarea::placeholder {
    color: #AD7E4B;
    opacity: 1;
  }

  /* Honeypot: visually hidden but present in the DOM, unlike display:none */
  .hp-field {
    position: absolute;
    left: -9999px;
    width: 0;
    height: 0;
    opacity: 0;
  }

  button[type="submit"] {
    background: #593F62;
    color: #FAF9F6;
    border: 2px solid #593F62;
    border-radius: 6px;
    padding: 10px 18px;
    min-width: 160px;
    height: 45px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  button[type="submit"]:hover {
    color: #593F62;
    background: #FED049;
    font-style: italic;
    text-decoration: underline;
  }

  body.dark-theme button[type="submit"] {
    background: #282828;
    color: #FAF9F6;
    border: 2px solid #AD7E4B;
    font-size: 18px;
    height: 45px;
  }

  body.dark-theme button[type="submit"]:hover {
    color: #FAF9F6;
    background: #282828;
    font-style: italic;
    text-decoration: underline;
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  footer {
    margin-top: auto;
    padding: 15px 23px;
    background: #593F62;
    color: #FAF9F6;
    text-align: center;
  }

  #status {
    font-size: 13px;
    color: var(--onyx);
    min-height: 18px;
    margin-top: 8px;
  }

  #status.error {
    color: #a33;
  }
</style>

<div class="contact-wrapper">
  <div class="card">
    <p class="typeline" id="typeline">&nbsp;</p>
    <h1>Say hello</h1>

    <div>
      <p class="vibe-label">Pick a vibe for your message</p>
      <div class="moods" id="moods">
        <button type="button" class="mood-btn" data-mood="Casual">Casual</button>
        <button type="button" class="mood-btn" data-mood="Excited">Excited</button>
        <button type="button" class="mood-btn" data-mood="Just saying hi">Just saying hi</button>
        <button type="button" class="mood-btn" data-mood="Business-y">Business-y</button>
      </div>
    </div>

    <form id="contact-form">
      <!-- Honeypot field: real users never see or fill this. Bots often do. -->
      <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

      <input type="text" name="name" placeholder="Your name (optional)">
      <input type="email" name="email" placeholder="your@email.com" required>
      <input type="text" name="subject" placeholder="Subject" required maxlength="150">
      <textarea name="message" placeholder="Your message" rows="5" required maxlength="3000"></textarea>
      <button type="submit" id="submit-btn">Send message</button>
    </form>

<script src="../script.js"></script>
<script>
  // Point this at wherever your backend actually ends up hosted
const API_URL = 'https://portfolio-contact-backend-b6q2.onrender.com/api/contact';

  // Typing intro effect
  const full = '> initializing contact form...';
  const typelineEl = document.getElementById('typeline');
  let i = 0;
  const timer = setInterval(() => {
    typelineEl.textContent = full.slice(0, i + 1);
    i++;
    if (i >= full.length) clearInterval(timer);
  }, 40);

  // Mood picker
  let selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMood = btn.dataset.mood;
    });
  });

  const form = document.getElementById('contact-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.classList.remove('error');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    const formData = new FormData(form);
    const payload = {
      name: formData.get('name'),
      email: formData.get('email'),
      subject: formData.get('subject'),
      message: formData.get('message'),
      website: formData.get('website'), // honeypot value, should be empty
      mood: selectedMood,
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Something went wrong.');
      }

      // Success: open the splash page in a new tab, reset the form here
      const params = new URLSearchParams({ mood: selectedMood || '' });
      window.open(`sent.html?${params.toString()}`, '_blank');

      form.reset();
      document.querySelectorAll('.mood-btn').forEach((b) => b.classList.remove('selected'));
      selectedMood = null;
      statusEl.textContent = 'Message sent — check the new tab!';
    } catch (err) {
      statusEl.textContent = err.message || 'Something went wrong. Please try again.';
      statusEl.classList.add('error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send message';
    }
  });
</script>
