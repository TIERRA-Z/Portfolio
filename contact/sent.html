<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent</title>
<style>
  :root {
    --white-alt: #FAF9F6;
    --onyx: #363946;
    --ash: #B1B6A6;
    --eng-violet: #593F62;
    --chi-violet: #7B6D8D;
    --yellow: #FED049;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: var(--onyx);
    color: var(--white-alt);
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .content {
    text-align: center;
    z-index: 2;
  }

  .paper-plane {
    font-size: 48px;
    display: inline-block;
    animation: fly 1.6s ease-out forwards;
  }

  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    60%  { transform: translate(60px, -60px) rotate(15deg); opacity: 1; }
    100% { transform: translate(140px, -140px) rotate(15deg); opacity: 0; }
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0.5rem 0 0.25rem;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.9s forwards;
  }

  p {
    color: var(--ash);
    font-size: 15px;
    margin: 0 0 1.5rem;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.1s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  button {
    background: var(--yellow);
    color: var(--onyx);
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.3s forwards;
  }

  button:hover {
    background: var(--ash);
  }

  .stars {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .star {
    position: absolute;
    background: var(--chi-violet);
    border-radius: 50%;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="content">
  <div class="paper-plane">&#9993;</div>
  <h1 id="headline">Message sent</h1>
  <p id="subtext">Thanks for reaching out — I'll get back to you soon.</p>
  <button onclick="window.close()">Close this tab</button>
</div>

<script>
  // Read the mood from the query string and personalize the message a little
  const params = new URLSearchParams(window.location.search);
  const mood = params.get('mood');

  const moodMessages = {
    'Curious': 'Love a curious mind. I\'ll get back to you soon.',
    'Excited': 'That energy is contagious. Talk soon!',
    'Just saying hi': 'Right back at you. Talk soon.',
    'Business-y': 'Got it — I\'ll follow up shortly.',
  };

  if (mood && moodMessages[mood]) {
    document.getElementById('subtext').textContent = moodMessages[mood];
  }

  // Scatter a few decorative dots in the background
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 18; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
